# markdownlint-cli2 config — auto-discovered by local runs and the CI action.
config:
  default: true
  MD013: false   # line-length — docs use long lines intentionally
  MD033: false   # inline HTML
  MD024:
    siblings_only: true   # allow duplicate headings under different sections
  MD041: false   # first line need not be a top-level heading
  MD060: false   # table-column-style — cosmetic pixel-alignment of table pipes
globs:
  - "**/*.md"
ignores:
  - "docs/superpowers/**"   # generated brainstorm/plan/spec snapshots
  - ".superpowers/**"       # SDD scratch (gitignored)
  - "node_modules/**"
