machine:
  network:
    hostname: worker-01 # TODO: Template
    nameservers:
      - 192.168.1.1
      - 9.9.9.9
    interfaces:
      - deviceSelector:
          busPath: "0*" # should select any hardware network device, if you have just one, it will be selected
        addresses:
          - 192.168.1.20/24 # TODO: Template
        mtu: 1500
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
  time:
    servers:
      - time.cloudflare.com