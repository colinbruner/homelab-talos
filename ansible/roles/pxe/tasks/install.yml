---

- name: install directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ directories }}"

  # NOTE: Installing both pxelinux / ipxe packages
  # if only relying on 1, this can be tweaked
- name: install required packages
  ansible.builtin.apt:
    pkg: "{{ packages + ipxe_packages }}"