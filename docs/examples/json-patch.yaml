###
# Patch
# NOTE: This allows more authorative control over arrays compared to 
# strategic merging which will simply append merging values to the end of an array.
###
- op: replace
  path: /machine/network/nameservers
  value:
    - 192.168.1.1
    - 9.9.9.9
- op: replace
  path: /machine/network/interfaces/0/addresses
  value:
    - 192.168.1.20/24