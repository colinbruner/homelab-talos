#@ load("@ytt:data", "data")

#! This defines the strategic merge configurations for all worker nodes

machine:
  kubelet:
    extraArgs:
      #! NOTE: This enables metrics server to recognize kubelet certificates
      #! https://www.talos.dev/v1.7/kubernetes-guides/configuration/deploy-metrics-server/
      rotate-server-certificates: true
  network:
    hostname: #@ data.values.hostname
    nameservers:
      - 192.168.1.1
      - 9.9.9.9
    interfaces:
      - deviceSelector:
          busPath: "0*" #! should select any hardware network device, if you have just one, it will be selected
        addresses: #@ data.values.addresses
        mtu: 1500
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
  time:
    servers:
      - time.cloudflare.com
cluster:
  controlPlane:
    #! NOTE: In a greater than single node deployment, this should be a DNS name
    #! https://www.talos.dev/v1.7/reference/configuration/v1alpha1/config/#Config.cluster.controlPlane.endpoint
    endpoint: https://192.168.1.20:6443