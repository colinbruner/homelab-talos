#@ load("@ytt:data", "data")

#! This defines the base network template for all nodes

machine:
  network:
    hostname: #@ data.values.hostname
    nameservers:
      - 192.168.1.1
      - 9.9.9.9
    interfaces:
      - deviceSelector:
          busPath: "0*" #! should select any hardware network device, if you have just one, it will be selected
        addresses: #@ data.values.addresses
        mtu: 1500
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
  time:
    servers:
      - time.cloudflare.com